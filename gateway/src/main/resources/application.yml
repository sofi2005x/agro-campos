server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Ruta para el microservicio de Campos y Lotes
        - id: campos-service-route
          uri: ${CAMPOS_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/campos/**

        # Ruta para el microservicio de Agronomia
        - id: agronomia-service-route
          uri: ${AGRONOMIA_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/agronomia/**

        # Ruta para el microservicio de Proyectos
        - id: proyectos-service-route
          uri: ${PROYECTOS_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/proyectos/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
