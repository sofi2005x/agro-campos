server.port=8084

spring.application.name=proyectos-service

# Datasource (una base por microservicio)
spring.datasource.url=jdbc:mysql://localhost:3306/agro_proyectos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator (health check del docker-compose)
management.endpoints.web.exposure.include=health,info

# Microservicios que consume este servicio (en Docker se pisan por variable de entorno)
app.campos.base-url=http://localhost:8082
app.agronomia.base-url=http://localhost:8083
# Timeout (ms) de conexion y lectura hacia campos-service y agronomia-service
app.http.timeout-ms=3000

# API publica Open-Meteo (pronostico por coordenadas, no requiere API key)
clima.open-meteo.base-url=https://api.open-meteo.com
clima.open-meteo.timeout-ms=3000
